[package]
name = "omaverse"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mikefsm/omaverse"
description = "Outline scripture, annotate the original languages, and diagram sentences — in plain files"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "1.1.6"
enchant = "0.3.0"
pangocairo = "0.22.9"
cairo-rs = { version = "0.22.9", features = ["pdf"] }

[profile.release]
opt-level = 2
strip = true
